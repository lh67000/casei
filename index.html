<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection...</title>
    <!-- Redirection instantanée vers le sous-dossier -->

</head>

        // Redirection JS de secours si la balise meta est ignorée
        window.location.href = "./website/main.html";

    <p>If no redirection, <a href="./website/main.html">click here</a>.</p>
</body>
</html>
